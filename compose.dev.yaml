services:
  dev-seed:
    profiles: ["dev-seed"]
    build:
      context: .
      dockerfile: docker/dev-seed.Dockerfile
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://analytics:analytics@postgres:5432/analytics}
      DEV_SEED_ORIGINS: ${PLAYGROUND_ORIGINS:-http://localhost:3000,http://localhost:3101,http://localhost:3102}
      DEV_SEED_INGEST_KEY: ${LOCAL_DEV_INGEST_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  playground-next:
    environment:
      NEXT_PUBLIC_ANALYTICS_SITE_ID: site_example
      NEXT_PUBLIC_ANALYTICS_INGEST_KEY: ${LOCAL_DEV_INGEST_KEY:-}

  playground-react:
    environment:
      NEXT_PUBLIC_ANALYTICS_SITE_ID: site_example
      NEXT_PUBLIC_ANALYTICS_INGEST_KEY: ${LOCAL_DEV_INGEST_KEY:-}

  playground-tanstack:
    environment:
      NEXT_PUBLIC_ANALYTICS_SITE_ID: site_example
      NEXT_PUBLIC_ANALYTICS_INGEST_KEY: ${LOCAL_DEV_INGEST_KEY:-}

  dashboard:
    environment:
      DASHBOARD_DEFAULT_ENVIRONMENT: ${DASHBOARD_DEFAULT_ENVIRONMENT:-development}
