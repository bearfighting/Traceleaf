services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: analytics_test
      POSTGRES_PASSWORD: analytics_test
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_test -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  test_postgres_data:
