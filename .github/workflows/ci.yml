name: CI

on:
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/quality.yml
    with:
      full_suite: false

  full-validation:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/quality.yml
    with:
      full_suite: true
