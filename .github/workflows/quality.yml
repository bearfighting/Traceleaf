name: Quality

on:
  workflow_call:
    inputs:
      full_suite:
        description: Run the complete end-to-end suite.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect documentation changes
        id: docs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- docs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check documentation formatting
        if: (github.event_name == 'pull_request' && steps.docs.outputs.changed == 'true') || inputs.full_suite
        run: pnpm format:check:docs

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Install pinned Rust schema generator
        run: cargo install cargo-typify --version 0.8.0 --locked

      - name: Test
        env:
          WORKSPACE_BUILD_READY: "true"
        run: pnpm test

      - name: Validate complete Compose configuration
        if: inputs.full_suite
        run: >-
          docker compose
          -f compose.yaml
          -f compose.backend.yaml
          --profile backend
          --profile storage
          --profile processing
          --profile dashboard
          config --quiet

  integration:
    runs-on: ubuntu-latest
    env:
      TEST_POSTGRES_ADMIN_URL: postgres://analytics:analytics@localhost:5432/postgres

    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration

      - name: Capture integration diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/integration
          postgres_container="$(docker ps -aq --filter name=postgres | head -n 1)"
          if [ -n "$postgres_container" ]; then
            docker logs "$postgres_container" > artifacts/integration/postgres.log 2>&1 || true
            docker inspect "$postgres_container" > artifacts/integration/postgres-inspect.json 2>&1 || true
          else
            printf '%s\n' "PostgreSQL service container was not found." > artifacts/integration/postgres.log
          fi
          docker ps -a > artifacts/integration/docker-ps.txt 2>&1 || true

      - name: Upload integration artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: integration-artifacts
          path: artifacts/integration
          if-no-files-found: ignore

  shared-api-e2e:
    if: inputs.full_suite
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROGRESS: plain

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run shared API E2E suites
        run: node tooling/ci/measure-ci-e2e.mjs shared-api pnpm e2e --suite api

      - name: Upload shared API CI measurement
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: shared-api-ci-measurement
          path: artifacts/ci-docker-cache/shared-api
          if-no-files-found: warn

      - name: Upload shared API E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: shared-api-e2e-artifacts
          path: artifacts/*-e2e
          if-no-files-found: ignore

      - name: Clean up E2E environment
        if: always()
        run: pnpm e2e:down

  dashboard-e2e:
    if: inputs.full_suite
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROGRESS: plain

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Dashboard E2E
        run: node tooling/ci/measure-ci-e2e.mjs dashboard pnpm e2e:dashboard

      - name: Print Dashboard E2E diagnostics
        if: failure()
        run: |
          if [ -f artifacts/dashboard-e2e/compose-ps.txt ]; then
            echo '===== Dashboard Compose services ====='
            cat artifacts/dashboard-e2e/compose-ps.txt
          fi
          if [ -f artifacts/dashboard-e2e/service-logs.txt ]; then
            echo '===== Dashboard Compose logs (last 250 lines) ====='
            tail -n 250 artifacts/dashboard-e2e/service-logs.txt
          fi

      - name: Upload Dashboard E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dashboard-e2e-artifacts
          path: artifacts/dashboard-e2e
          if-no-files-found: ignore

      - name: Upload Dashboard CI cache measurement
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dashboard-ci-cache-measurement
          path: artifacts/ci-docker-cache/dashboard
          if-no-files-found: warn

      - name: Clean up E2E environment
        if: always()
        run: pnpm e2e:down

  router-adapters-e2e:
    if: inputs.full_suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Run Router Adapter E2E
        run: node tooling/ci/measure-ci-e2e.mjs router-adapters pnpm e2e:router-adapters

      - name: Upload Router Adapter CI measurement
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: router-adapters-ci-measurement
          path: artifacts/ci-docker-cache/router-adapters
          if-no-files-found: warn

      - name: Clean up E2E environment
        if: always()
        run: pnpm e2e:down

  site-onboarding-e2e:
    if: inputs.full_suite
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROGRESS: plain
      E2E_ONBOARDING_PROJECT: web-analytics-site-onboarding-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Site Onboarding E2E
        run: node tooling/ci/measure-ci-e2e.mjs site-onboarding pnpm e2e:site-onboarding

      - name: Upload Site Onboarding CI measurement
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: site-onboarding-ci-measurement
          path: artifacts/ci-docker-cache/site-onboarding
          if-no-files-found: warn

      - name: Upload Site Onboarding E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: site-onboarding-e2e-artifacts
          path: artifacts/site-onboarding-e2e
          if-no-files-found: ignore

      - name: Clean up E2E environment
        if: always()
        run: >-
          docker compose -p "$E2E_ONBOARDING_PROJECT"
          -f compose.yaml -f compose.backend.yaml -f compose.e2e.yaml
          down --volumes --remove-orphans

  dev-startup-e2e:
    if: inputs.full_suite
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROGRESS: plain

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run development startup E2E
        run: node tooling/ci/measure-ci-e2e.mjs dev-startup pnpm e2e:dev-startup

      - name: Upload development startup CI cache measurement
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dev-startup-ci-cache-measurement
          path: artifacts/ci-docker-cache/dev-startup
          if-no-files-found: warn

      - name: Clean up E2E environment
        if: always()
        run: pnpm e2e:down

  router-compose-e2e:
    if: inputs.full_suite
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROGRESS: plain

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Router Compose E2E
        run: node tooling/ci/measure-ci-e2e.mjs router-compose pnpm e2e:router-compose

      - name: Upload Router Compose CI measurement
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: router-compose-ci-measurement
          path: artifacts/ci-docker-cache/router-compose
          if-no-files-found: warn

      - name: Clean up E2E environment
        if: always()
        run: pnpm e2e:down
