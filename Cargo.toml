[workspace]
members = [
	"crates/configuration-runtime",
    "services/analytics-api",
    "services/collector",
    "services/processor",
    "tools/db-migrator",
    "tools/site-registry-importer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
configuration-runtime = { path = "crates/configuration-runtime" }
regress = "0.12.0"
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
http-body-util = "0.1"
jsonschema = "0.57"
maxminddb = "0.32"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "2", features = ["full", "visit"] }
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
woothee = "=0.13.0"
url = "2"
