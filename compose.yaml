services:
  playground-next:
    profiles: ["playground-next"]
    build:
      context: .
      dockerfile: docker/router-playground.Dockerfile
    environment:
      NEXT_PUBLIC_ANALYTICS_TRANSPORT: ${NEXT_PUBLIC_ANALYTICS_TRANSPORT:-mock}
      NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${NEXT_PUBLIC_ANALYTICS_ENDPOINT:-}
      NEXT_PUBLIC_ANALYTICS_INGEST_KEY: ${NEXT_PUBLIC_ANALYTICS_INGEST_KEY:-}
      NEXT_PUBLIC_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_ANALYTICS_SITE_ID:-site_playground}
    ports:
      - "${PLAYGROUND_NEXT_PORT:-3000}:3000"
    command: >-
      sh -c "pnpm install --frozen-lockfile && pnpm build:packages && pnpm --filter
      @web-analytics/nextjs-router-playground dev --hostname 0.0.0.0"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - playground_next_node_modules:/workspace/examples/nextjs-router-playground/node_modules
      - playground_next:/workspace/examples/nextjs-router-playground/.next

  playground-react:
    profiles: ["playground-react"]
    build:
      context: .
      dockerfile: docker/router-playground.Dockerfile
    environment:
      NEXT_PUBLIC_ANALYTICS_TRANSPORT: ${NEXT_PUBLIC_ANALYTICS_TRANSPORT:-mock}
      NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${NEXT_PUBLIC_ANALYTICS_ENDPOINT:-}
      NEXT_PUBLIC_ANALYTICS_INGEST_KEY: ${NEXT_PUBLIC_ANALYTICS_INGEST_KEY:-}
      NEXT_PUBLIC_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_ANALYTICS_SITE_ID:-site_playground}
    ports:
      - "${PLAYGROUND_REACT_PORT:-3101}:3101"
    command: >-
      sh -c "pnpm install --frozen-lockfile && pnpm build:packages && pnpm --filter
      @web-analytics/react-router-playground dev --host 0.0.0.0 --port 3101"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - playground_react_node_modules:/workspace/examples/react-router-playground/node_modules

  playground-tanstack:
    profiles: ["playground-tanstack"]
    build:
      context: .
      dockerfile: docker/router-playground.Dockerfile
    environment:
      NEXT_PUBLIC_ANALYTICS_TRANSPORT: ${NEXT_PUBLIC_ANALYTICS_TRANSPORT:-mock}
      NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${NEXT_PUBLIC_ANALYTICS_ENDPOINT:-}
      NEXT_PUBLIC_ANALYTICS_INGEST_KEY: ${NEXT_PUBLIC_ANALYTICS_INGEST_KEY:-}
      NEXT_PUBLIC_ANALYTICS_SITE_ID: ${NEXT_PUBLIC_ANALYTICS_SITE_ID:-site_playground}
    ports:
      - "${PLAYGROUND_TANSTACK_PORT:-3102}:3102"
    command: >-
      sh -c "pnpm install --frozen-lockfile && pnpm build:packages && pnpm --filter
      @web-analytics/tanstack-router-playground dev --host 0.0.0.0 --port 3102"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - playground_tanstack_node_modules:/workspace/examples/tanstack-router-playground/node_modules

  collector:
    profiles: ["backend"]
    build:
      context: .
      dockerfile: docker/collector.Dockerfile
    environment:
      RUST_LOG: collector=info
      COLLECTOR_CONFIG: ${COLLECTOR_CONFIG:-/workspace/protocol/contracts/http-ingestion/current/config/collector.example.toml}
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://analytics:analytics@postgres:5432/analytics}
      GEOIP_DATABASE_PATH: ${GEOIP_DATABASE_PATH:-/workspace/data/GeoLite2-Country.mmdb}
      GEOIP_TRUSTED_PROXIES: ${GEOIP_TRUSTED_PROXIES:-}
    ports:
      - "4001:4001"
    volumes:
      - .:/workspace
      - collector_target:/workspace/target
      - ./data:/workspace/data:ro

  postgres:
    profiles: ["storage"]
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 15

  db-migrate:
    profiles: ["storage"]
    build:
      context: .
      dockerfile: docker/db-migrator.Dockerfile
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://analytics:analytics@postgres:5432/analytics}
      RUST_LOG: db_migrator=info
    depends_on:
      postgres:
        condition: service_healthy

  db-audit-purger:
    profiles: ["storage"]
    build:
      context: .
      dockerfile: docker/db-migrator.Dockerfile
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://analytics:analytics@postgres:5432/analytics}
      RUST_LOG: db_migrator=info
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do if /usr/local/bin/db-migrator --purge-expired-configuration-audit; then sleep 86400; else sleep 3600; fi; done"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  processor:
    profiles: ["processing"]
    build:
      context: .
      dockerfile: docker/processor.Dockerfile
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://analytics:analytics@postgres:5432/analytics}
      PROCESSOR_POLL_INTERVAL_MS: ${PROCESSOR_POLL_INTERVAL_MS:-1000}
      RUST_LOG: processor=info
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - processor_target:/workspace/target

  analytics-api:
    profiles: ["processing"]
    build:
      context: .
      dockerfile: docker/analytics-api.Dockerfile
    environment:
      DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgres://analytics:analytics@postgres:5432/analytics}
      CONFIG_ADMIN_TOKENS: ${CONFIG_ADMIN_TOKENS:-}
      RUST_LOG: analytics_api=info
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:4002/health || exit 1"]
      interval: 2s
      timeout: 2s
      start_period: 180s
      retries: 15
    volumes:
      - .:/workspace
      - analytics_api_target:/workspace/target

  dashboard:
    profiles: ["dashboard"]
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      CI: "true"
      ANALYTICS_API_URL: ${DASHBOARD_ANALYTICS_API_URL:-http://analytics-api:4002}
      DASHBOARD_SITES: ${DASHBOARD_SITES:-site_playground,site_alpha,site_beta}
      DASHBOARD_DEFAULT_SITE: ${DASHBOARD_DEFAULT_SITE:-site_playground}
      DASHBOARD_DEFAULT_ENVIRONMENT: ${DASHBOARD_DEFAULT_ENVIRONMENT:-production}
      DASHBOARD_CONFIG_ADMIN_TOKEN: ${DASHBOARD_CONFIG_ADMIN_TOKEN:-}
    ports:
      - "${DASHBOARD_PORT:-13000}:3000"
    depends_on:
      analytics-api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/dashboard >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      start_period: 180s
      retries: 20
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - dashboard_node_modules:/workspace/apps/dashboard/node_modules
      - dashboard_next:/workspace/apps/dashboard/.next

volumes:
  root_node_modules:
  playground_next_node_modules:
  playground_react_node_modules:
  playground_tanstack_node_modules:
  playground_next:
  collector_target:
  postgres_data_v18:
  processor_target:
  analytics_api_target:
  dashboard_node_modules:
  dashboard_next:
  dashboard_error_next:
