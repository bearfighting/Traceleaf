# Phase 2 Collector development configuration example.
# The ingest keys below are placeholders, not production credentials.

[[sites]]
site_id = "site_example"
environment = "development"
enabled = true
allowed_origins = ["http://localhost:3000", "http://localhost:3101", "http://localhost:3102"]
ingest_keys = ["public-key-example"]

[[sites]]
site_id = "site_example"
environment = "production"
enabled = true
allowed_origins = ["https://www.example.com"]
ingest_keys = ["public-key-production-example"]

[[sites]]
site_id = "site_disabled"
environment = "production"
enabled = false
allowed_origins = ["https://www.example.com"]
ingest_keys = ["public-key-disabled-example"]
